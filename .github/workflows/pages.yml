# Deploy the static docs/ site to GitHub Pages via the official Pages Actions.
# Project site: url = https://keep-maker.github.io, baseurl = /agent-token-efficiency-skill.
# Prerequisite (one-time, manual): enable GitHub Pages in the repo settings
# (Settings -> Pages -> Build and deployment -> Source = "GitHub Actions").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow only one concurrent deployment; skip intermediate ones.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No theme in _config.yml -> Jekyll pass-through build.
      - name: Build with Jekyll
        working-directory: docs
        run: jekyll build --baseurl "/agent-token-efficiency-skill" --url "https://keep-maker.github.io" --destination "$(pwd)/_site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Wait for Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            let deployment = await context.github.rest.pages
              .getLatestDeployment({ owner: context.repo.owner, repo: context.repo.repo });
            let attempt = 0;
            while (deployment.data.status === 'building' && attempt < 60) {
              await new Promise((r) => setTimeout(r, 5000));
              attempt++;
              deployment = await context.github.rest.pages
                .getLatestDeployment({ owner: context.repo.owner, repo: context.repo.repo });
            }
            if (deployment.data.status !== 'succeeded') {
              core.setFailed(`Pages deployment did not succeed: ${deployment.data.status}`);
            }
            core.setOutput('page_url', deployment.data.page_url || '');
