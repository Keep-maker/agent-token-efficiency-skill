# Deploy the static docs/ site to GitHub Pages via the official Pages Actions.
# Project site: url = https://keep-maker.github.io, baseurl = /agent-token-efficiency-skill.
# Prerequisite (one-time, manual): enable GitHub Pages in the repo settings
# (Settings -> Pages -> Build and deployment -> Source = "GitHub Actions").
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow only one concurrent deployment; skip intermediate ones.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # docs/ is a pure static site (index.html + _headers + _config.yml + .nojekyll).
      # No Jekyll build step needed; .nojekyll prevents Jekyll from generating
      # a static site from this directory.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # deploy-pages reports success as soon as GitHub's Pages API accepts the
      # deployment. This best-effort poll observes the final state for the
      # workflow UI; it never fails the workflow (continue-on-error).
      - name: Confirm Pages deployment status
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/Keep-maker/agent-token-efficiency-skill/pages/deployments"
          status=""
          for i in $(seq 1 24); do
            status=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api?per_page=1" | jq -r '.deployments[0].status // "pending"')
            echo "pages deployment status: $status (attempt $i/24)"
            [ "$status" = "succeeded" ] && break
            [ "$status" = "failed" ] && break
            sleep 5
          done
          echo "Final Pages deployment status: $status"
